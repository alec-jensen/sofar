openapi: 3.0.3
info:
  title: sofar
  version: 1.0.0
  description: >
    sofar's JSON API. This file is the contract (ADR-0015): handlers are checked
    against it in tests, and the web client's types are generated from it.
    Errors always use the Error schema. Writes need the Origin header to match
    the server and Content-Type application/json.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: push
  - name: ledger
  - name: categories
  - name: imports
  - name: events
  - name: budget
  - name: recurring
  - name: money

paths:
  /healthz:
    get:
      tags: [health]
      summary: the process is alive
      operationId: healthz
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      tags: [health]
      summary: the database is reachable and migrations are current
      operationId: readyz
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/status:
    get:
      tags: [auth]
      summary: whether setup is needed and whether the caller is signed in
      operationId: authStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/setup:
    post:
      tags: [auth]
      summary: create the one account (needs the server's setup key) and sign in
      operationId: authSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, setupKey]
              properties:
                username: { type: string }
                password: { type: string }
                setupKey: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: sign in; code is a six-digit authenticator code or a recovery code
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: end this session
      operationId: authLogout
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: start two-step enrollment; returns the secret and otpauth url
      operationId: totpSetup
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secret, url]
                properties:
                  secret: { type: string }
                  url: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/confirm:
    post:
      tags: [auth]
      summary: finish enrollment; returns recovery codes, shown once
      operationId: totpConfirm
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, recoveryCodes]
                properties:
                  ok: { type: boolean }
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/disable:
    post:
      tags: [auth]
      summary: turn two-step verification off
      operationId: totpDisable
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: change the password; other sessions and push subscriptions are removed
      operationId: changePassword
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current, next]
              properties:
                current: { type: string }
                next: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/recovery-codes:
    post:
      tags: [auth]
      summary: replace the recovery codes (needs the password and two-step on)
      operationId: regenerateRecoveryCodes
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/push/config:
    get:
      tags: [push]
      summary: the VAPID public key
      operationId: pushConfig
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicKey]
                properties:
                  publicKey: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/subscribe:
    post:
      tags: [push]
      summary: register this device for notifications
      operationId: pushSubscribe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                expirationTime: { nullable: true }
                keys:
                  type: object
                  required: [auth, p256dh]
                  properties:
                    auth: { type: string }
                    p256dh: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/unsubscribe:
    post:
      tags: [push]
      summary: remove this device
      operationId: pushUnsubscribe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/devices:
    get:
      tags: [push]
      summary: how many devices receive notifications
      operationId: pushDevices
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/revoke-all:
    post:
      tags: [push]
      summary: stop notifications on every device
      operationId: pushRevokeAll
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts:
    get:
      tags: [ledger]
      summary: every account
      operationId: listAccounts
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ledger]
      summary: create a manual account
      operationId: createAccount
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { $ref: "#/components/schemas/AccountKind" }
                currency: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{id}:
    patch:
      tags: [ledger]
      summary: change an account's kind, display name or active flag
      operationId: patchAccount
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: { $ref: "#/components/schemas/AccountKind" }
                display_name: { type: string, description: "empty clears the override" }
                active: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/transactions:
    get:
      tags: [ledger]
      summary: effective transactions, newest first
      operationId: listTransactions
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: month, in: query, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
        - { name: account, in: query, schema: { type: string, format: uuid } }
        - { name: include_hidden, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next: { type: string }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ledger]
      summary: add a manual transaction (negative amount is an outflow, in cents)
      operationId: createTransaction
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, date, amount, description]
              properties:
                account_id: { type: string, format: uuid }
                date: { type: string, format: date }
                amount: { type: integer, format: int64 }
                description: { type: string }
                payee: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}:
    get:
      tags: [ledger]
      summary: one transaction
      operationId: getTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [ledger]
      summary: >
        change overlay fields (category_id, note, tags, month, from_discretionary,
        reviewed, type) and, for manual transactions only, date, amount, description, payee
      operationId: patchTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category_id: { type: string, nullable: true }
                note: { type: string }
                tags: { type: array, items: { type: string } }
                month: { type: string, nullable: true, pattern: "^[0-9]{4}-[0-9]{2}$" }
                from_discretionary: { type: boolean }
                reviewed: { type: boolean }
                type: { type: string, nullable: true }
                date: { type: string, format: date }
                amount: { type: integer, format: int64 }
                description: { type: string }
                payee: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/split:
    post:
      tags: [ledger]
      summary: split into parts that sum to the total; an empty list removes the split
      operationId: splitTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [amount, category_id]
                    properties:
                      amount: { type: integer, format: int64 }
                      category_id: { type: string }
                      tags: { type: array, items: { type: string } }
                      note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/hide:
    post:
      tags: [ledger]
      summary: hide (a reversible soft delete that sync never re-imports)
      operationId: hideTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/unhide:
    post:
      tags: [ledger]
      summary: undo a hide
      operationId: unhideTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/categories:
    get:
      tags: [categories]
      summary: the bucket, group, category tree
      operationId: listCategories
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/CategoryGroup" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [categories]
      summary: create a custom category in a group
      operationId: createCategory
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, name]
              properties:
                group_id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/category-groups:
    post:
      tags: [categories]
      summary: create a custom group in a bucket
      operationId: createCategoryGroup
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, bucket]
              properties:
                name: { type: string }
                bucket: { type: string, enum: [income, bills, subscriptions, savings, spending] }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryGroup" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/categories/{id}:
    patch:
      tags: [categories]
      summary: rename (the id never changes)
      operationId: renameCategory
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [categories]
      summary: delete, moving transactions to reassign_to (default "other" in the same bucket)
      operationId: deleteCategory
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: reassign_to, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/categories/{id}/merge:
    post:
      tags: [categories]
      summary: move everything into another category and retire this one
      operationId: mergeCategory
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [into]
              properties:
                into: { type: string }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/categories/{id}/proposals:
    get:
      tags: [categories]
      summary: merchants that probably belong in a new category
      operationId: categoryProposals
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [merchant_key, count, current_category]
                      properties:
                        merchant_key: { type: string }
                        count: { type: integer }
                        current_category: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/categories/{id}/move-merchants:
    post:
      tags: [categories]
      summary: move merchants into a category, as one undoable change per merchant
      operationId: moveMerchants
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [merchant_keys]
              properties:
                merchant_keys: { type: array, items: { type: string } }
      responses:
        "200":
          description: ok; each event id can be passed to /events/{id}/undo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event_ids]
                properties:
                  event_ids: { type: array, items: { type: integer } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/review/queue:
    get:
      tags: [review]
      summary: transactions waiting for review, uncertain first
      operationId: reviewQueue
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/QueueItem" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/review/batch:
    post:
      tags: [review]
      summary: confirm every waiting transaction of one merchant, calling out outliers
      operationId: reviewBatch
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [merchant_key, category]
              properties:
                merchant_key: { type: string }
                category: { type: string }
                scope: { type: string }
                session_id: { type: string }
                dwell_ms: { type: integer }
                include_outliers: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [confirmed, outliers, prompts]
                properties:
                  confirmed: { type: array, items: { type: string } }
                  outliers: { type: array, items: { type: string } }
                  prompts: { type: array, items: { $ref: "#/components/schemas/ReviewPrompt" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/review/{txn}/confirm:
    post:
      tags: [review]
      summary: accept the suggestion on a transaction
      operationId: reviewConfirm
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Txn" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewBody" }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/review/{txn}/recategorize:
    post:
      tags: [review]
      summary: choose a category and how widely to learn from it
      operationId: reviewRecategorize
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Txn" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewBody" }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/imports:
    post:
      tags: [imports]
      summary: parse a file and return the dry run; nothing is written to the ledger
      operationId: createImport
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, format, content]
              properties:
                account_id: { type: string, format: uuid }
                format: { type: string, enum: [csv, ofx, qfx, qif] }
                filename: { type: string }
                content: { type: string }
                base64: { type: boolean }
                day_first: { type: boolean }
                mapping: { $ref: "#/components/schemas/CsvMapping" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}:
    get:
      tags: [imports]
      summary: a staged or applied import
      operationId: getImport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/apply:
    post:
      tags: [imports]
