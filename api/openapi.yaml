        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/undo:
    post:
      tags: [imports]
      summary: hide an applied import's rows (they are never deleted)
      operationId: undoImport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/events/{id}/undo:
    post:
      tags: [events]
      summary: reverse a decision by event id
      operationId: undoEvent
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/events/{id}/redo:
    post:
      tags: [events]
      summary: reverse an undo, by the undo event's id
      operationId: redoEvent
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/home:
    get:
      tags: [budget]
      summary: the hero number for the current month, from the stored snapshot
      operationId: getHome
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/explain:
    get:
      tags: [budget]
      summary: why the number is what it is (entries, absorption ledger, plain sentences)
      operationId: explainMonth
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explain" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/plan-override:
    post:
      tags: [budget]
      summary: override the plan for a month (undo with /events/{id}/undo)
      operationId: setPlanOverride
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cents]
              properties:
                cents: { type: integer, format: int64, minimum: 0 }
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/recurring:
    get:
      tags: [recurring]
      summary: recurring items, detected candidates waiting for an answer, and signals
      operationId: listRecurring
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, candidates, signals]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RecurringItem" } }
                  candidates: { type: array, items: { $ref: "#/components/schemas/RecurringCandidate" } }
                  signals: { type: array, items: { $ref: "#/components/schemas/RecurringSignal" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [recurring]
      summary: add a recurring item by hand
      operationId: createRecurring
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/candidates/confirm:
    post:
      tags: [recurring]
      summary: say yes to a detected candidate
      operationId: confirmCandidate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string }
                kind: { type: string, enum: [bill, subscription, income, payment_plan] }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/candidates/dismiss:
    post:
      tags: [recurring]
      summary: say it is not recurring, so detection will not ask about this merchant again
      operationId: dismissCandidate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, direction]
              properties:
                key: { type: string }
                direction: { type: string, enum: ["in", "out"] }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/{id}/end:
    post:
      tags: [recurring]
      summary: stop an item (a cancelled bill frees its reserve into uncategorized)
      operationId: endRecurring
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                on: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/recurring:
    post:
      tags: [recurring]
      summary: mark a transaction as recurring (bypasses the detection threshold)
      operationId: markRecurring
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/forecast:
    get:
      tags: [budget]
      summary: the plan so far and expected by schedule, with suggestions for the pot (never applied)
      operationId: forecastMonth
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [month, source_month, plan_so_far, plan_expected, extras, suggestions]
                properties:
                  month: { type: string }
                  source_month: { type: string }
                  plan_so_far: { type: integer, format: int64 }
                  plan_expected: { type: integer, format: int64 }
                  extras: { type: array, items: { type: string } }
                  suggestions:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [stream, kind, amount, suggest, label]
                      properties:
                        stream: { type: string }
                        kind: { type: string, enum: [extra_occurrence, amount_increase, lump] }
                        amount: { type: integer, format: int64 }
                        suggest: { type: string, enum: [one_time, permanent] }
                        label: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/settings/savings:
    get:
      tags: [money]
      summary: the general savings rule in force
      operationId: getSavings
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Savings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [money]
      summary: set the savings rule from a month onward (fixed cents or basis points of the plan)
      operationId: putSavings
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Savings" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version_id]
                properties:
                  version_id: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/ef:
    get:
      tags: [money]
      summary: the emergency fund settings, target and balance
      operationId: getEF
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [months, target_override, line, target, balance]
                properties:
                  months: { type: integer }
                  target_override: { type: integer, format: int64, nullable: true }
                  line: { type: integer, format: int64 }
                  target: { type: integer, format: int64 }
                  balance: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [money]
      summary: set the emergency fund from this month (a target change is not a withdrawal)
      operationId: putEF
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [months, line]
              properties:
                months: { type: integer, minimum: 1, maximum: 24 }
                target_override: { type: integer, format: int64, nullable: true }
                line: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/goals:
    get:
      tags: [money]
      summary: goals with balances and derived dates
      operationId: listGoals
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Goal" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [money]
      summary: create a goal with a monthly amount or a date (the other is derived)
      operationId: createGoal
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, target]
              properties:
                name: { type: string }
                target: { type: integer, format: int64 }
                monthly: { type: integer, format: int64 }
                target_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                priority: { type: integer }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/goals/{id}:
    patch:
      tags: [money]
      summary: edit from this month onward (target, monthly, date, paused)
      operationId: patchGoal
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target: { type: integer, format: int64 }
                monthly: { type: integer, format: int64 }
                target_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                paused: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/goals/{id}/complete:
    post:
      tags: [money]
      summary: the goal is done; its contribution stops and frees into uncategorized
      operationId: completeGoal
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/goals/{id}/abandon:
    post:
      tags: [money]
      summary: abandon the goal; move its balance with a separate action
      operationId: abandonGoal
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/pot:
    get:
      tags: [money]
      summary: the uncategorized money and suggestions for it (never applied automatically)
      operationId: getPot
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pot" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/allocations:
    post:
      tags: [money]
      summary: allocate the pot, one-time or permanent; over-allocating is allowed and shown
      operationId: allocatePot
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [dest, amount]
                    properties:
                      dest: { type: string, description: "spending, savings, ef, discretionary or goal:<id>" }
                      amount: { type: integer, format: int64, minimum: 1 }
                      permanent: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/EventIds" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/allocations/{event}/make-permanent:
    post:
      tags: [money]
      summary: turn a past one-time allocation into a standing line
      operationId: makePermanent
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Month" }
        - { name: event, in: path, required: true, schema: { type: integer } }
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/standing/{event}/remove:
    post:
      tags: [money]
      summary: remove a standing line (the event id of the allocation that created it)
      operationId: removeStanding
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Month" }
        - { name: event, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/spend-base:
    post:
      tags: [money]
      summary: edit spending money by hand; it is pinned and never auto-reversed
      operationId: editSpendBase
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/spend-base/unpin:
    post:
      tags: [money]
      summary: remove the spend_base pin
      operationId: unpinSpendBase
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/moved-it:
    post:
      tags: [money]
      summary: confirm planned savings by hand (i moved it)
      operationId: movedIt
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/overspends:
    get:
      tags: [money]
      summary: months with overspending; prompts only for the current and previous month
      operationId: listOverspends
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [month, gross, covers, open, prompt, passive]
                      properties:
                        month: { type: string }
                        gross: { type: integer, format: int64 }
                        covers: { type: integer, format: int64 }
                        open: { type: integer, format: int64 }
                        prompt: { type: boolean }
                        passive: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/overspends/{ym}/covers:
    post:
      tags: [money]
      summary: cover an overspend from next month, savings, a goal, the ef, the bills reserve, or leave it uncovered
      operationId: coverOverspend
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Month" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [covers]
              properties:
                covers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [source, amount]
                    properties:
                      source: { type: string }
                      amount: { type: integer, format: int64, minimum: 1 }
                rebuild_months: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/EventIds" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/uncovered/settle:
    post:
      tags: [money]
      summary: pay down uncovered overspending from savings, a goal or the ef
      operationId: settleUncovered
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, amount]
              properties:
                source: { type: string }
                amount: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/preview:
    post:
      tags: [money]
      summary: run a proposed change in memory and return before and after; writes nothing
      operationId: previewChange
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                plan_override: { type: integer, format: int64, minimum: 0 }
                spend_base: { type: integer, format: int64, minimum: 0 }
                allocations:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [dest, amount]
                    properties:
                      dest: { type: string }
                      amount: { type: integer, format: int64 }
                      permanent: { type: boolean }
                savings: { $ref: "#/components/schemas/Savings" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [month, before, after, next_before, next_after, goals]
                properties:
                  month: { type: string }
                  before: { $ref: "#/components/schemas/Figures" }
                  after: { $ref: "#/components/schemas/Figures" }
                  next_before: { $ref: "#/components/schemas/Figures" }
                  next_after: { $ref: "#/components/schemas/Figures" }
                  goals:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, balance_before, balance_after, derived_date_after]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        balance_before: { type: integer, format: int64 }
                        balance_after: { type: integer, format: int64 }
                        derived_date_after: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/rollover/checklist:
    get:
      tags: [money]
      summary: the transfers to make to match this month's planned savings, goal and ef credits
      operationId: getChecklist
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [month, items, planned, verified, remaining, accounts]
                properties:
                  month: { type: string }
                  planned: { type: integer, format: int64 }
                  verified: { type: integer, format: int64 }
                  remaining: { type: integer, format: int64 }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [label, kind, amount]
                      properties:
                        label: { type: string }
                        kind: { type: string, enum: [savings, goal, ef] }
                        amount: { type: integer, format: int64 }
                  accounts:
                    type: array
                    items:
                      type: object
                      additionalProperties: { type: string }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sofar_session
  parameters:
    Month:
      name: ym
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Txn:
      name: txn
      in: path
      required: true
      schema: { type: string }
    IntId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  responses:
    ReviewResult:
      description: ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [transaction, weight, learned_rules, prompts, proposal]
            properties:
              transaction: { $ref: "#/components/schemas/Transaction" }
              weight: { type: number }
              learned_rules: { type: array, items: { type: string } }
              prompts: { type: array, items: { $ref: "#/components/schemas/ReviewPrompt" } }
              proposal:
                type: object
                additionalProperties: false
                required: [merchant_key, unreviewed, labeled, suggested_scope]
                properties:
                  merchant_key: { type: string }
                  unreviewed: { type: integer }
                  labeled: { type: integer }
                  suggested_scope: { type: string }
    Ok:
      description: ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { type: boolean }
    EventResult:
      description: ok; event_id can be passed to /events/{id}/undo
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [event_id]
            properties:
              event_id: { type: integer, format: int64 }
    EventIds:
      description: ok; the ids of the events written, each undoable
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [event_ids]
            properties:
              event_ids: { type: array, items: { type: integer, format: int64 } }
    TransactionChange:
      description: the updated transaction and the events that changed it (undo them by id)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [transaction, event_ids]
            properties:
              transaction: { $ref: "#/components/schemas/Transaction" }
              event_ids: { type: array, items: { type: integer, format: int64 } }
    Error:
      description: an error; the code is stable, the message is for people
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ReviewBody:
      type: object
      additionalProperties: false
      properties:
        category: { type: string }
        scope: { type: string, description: "this_time, merchant, merchant_amount_range, merchant_account or description_pattern" }
        session_id: { type: string }
        dwell_ms: { type: integer }
    ReviewPrompt:
      type: object
      additionalProperties: false
      required: [kind, rule_id, detail]
      properties:
        kind: { type: string }
        rule_id: { type: string, nullable: true }
        detail: { type: string }
    Suggestion:
      type: object
      nullable: true
      additionalProperties: false
      required: [category, source, confidence, reason, rule_id, alternatives, flags]
      properties:
        category: { type: string }
        source: { type: string }
        confidence: { type: number }
        reason: { type: string }
        rule_id: { type: string, nullable: true }
        alternatives:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, confidence, source]
            properties:
              category: { type: string }
              confidence: { type: number }
              source: { type: string }
        flags: { type: array, items: { type: string } }
    QueueItem:
      type: object
      additionalProperties: false
      required: [transaction, suggestion, group_key, audit]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        suggestion: { $ref: "#/components/schemas/Suggestion" }
        group_key: { type: string }
        audit: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthStatus:
      type: object
      additionalProperties: false
      required: [authenticated, setup, totpEnabled]
      properties:
        authenticated: { type: boolean }
        setup: { type: boolean, description: "true when no account exists yet" }
        totpEnabled: { type: boolean }
    RecoveryCodes:
      type: array
      minItems: 8
      maxItems: 8
      items: { type: string }
    AccountKind:
      type: string
      enum: [budget, tracked, balance_only, liability]
    Account:
      type: object
      additionalProperties: false
      required: [id, provider, name, display_name, institution, mask, currency, kind, active]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        name: { type: string }
        display_name: { type: string }
        institution: { type: string }
        mask: { type: string }
        currency: { type: string }
        kind: { $ref: "#/components/schemas/AccountKind" }
        active: { type: boolean }
    TransactionPart:
      type: object
      additionalProperties: false
      required: [amount, category_id, bucket, tags, note]
      properties:
        amount: { type: integer, format: int64 }
        category_id: { type: string }
        bucket: { type: string }
        tags: { type: array, items: { type: string } }
        note: { type: string }
    Transaction:
      type: object
      additionalProperties: false
      required: [id, account_id, date, transacted_date, amount, description, payee, memo, pending, missing_from_bank, manual, category_id, bucket, month, month_override, note, tags, hidden, from_discretionary, type, reviewed, splits]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        date: { type: string, format: date, description: "the posted date; a calendar date, never converted between zones" }
        transacted_date: { type: string, format: date, nullable: true }
        amount: { type: integer, format: int64, description: "cents; negative is an outflow" }
        description: { type: string }
        payee: { type: string }
        memo: { type: string }
        pending: { type: boolean }
        missing_from_bank: { type: boolean }
        manual: { type: boolean }
        category_id: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        month: { type: string, description: "the month the transaction counts in" }
        month_override: { type: string, nullable: true }
        note: { type: string }
        tags: { type: array, items: { type: string } }
        hidden: { type: boolean }
        from_discretionary: { type: boolean }
        type: { type: string, nullable: true }
        reviewed: { type: boolean }
        splits: { type: array, items: { $ref: "#/components/schemas/TransactionPart" } }
    Category:
      type: object
      additionalProperties: false
      required: [id, name, is_default]
      properties:
        id: { type: string }
        name: { type: string }
        is_default: { type: boolean }
    CategoryGroup:
      type: object
      additionalProperties: false
      required: [id, name, bucket, is_default, categories]
      properties:
        id: { type: string }
        name: { type: string }
        bucket: { type: string, enum: [income, bills, subscriptions, savings, spending, neutral] }
        is_default: { type: boolean }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
    CsvMapping:
      type: object
      additionalProperties: false
      required: [has_header, date, description]
      properties:
        has_header: { type: boolean }
        delimiter: { type: string }
        date: { type: string }
        date_format: { type: string }
        amount: { type: string }
        debit: { type: string }
        credit: { type: string }
        description: { type: string }
        payee: { type: string }
        memo: { type: string }
        id: { type: string }
        invert: { type: boolean }
    ImportSummary:
      type: object
      additionalProperties: false
      required: [total, add, duplicates, revive, hidden, skipped]
      properties:
        total: { type: integer }
        add: { type: integer }
        duplicates: { type: integer }
        revive: { type: integer }
        hidden: { type: integer }
        skipped: { type: integer }
        from: { type: string }
        to: { type: string }
    Import:
      type: object
      additionalProperties: false
      required: [id, status, filename, summary, rows, skipped]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [dry_run, applied, undone] }
        filename: { type: string }
        summary: { $ref: "#/components/schemas/ImportSummary" }
        rows:
          type: array
          description: the first 200 rows with what applying would do
          items:
            type: object
            additionalProperties: false
            required: [date, amount, description, outcome]
            properties:
              date: { type: string, format: date }
              amount: { type: integer, format: int64 }
              description: { type: string }
              outcome: { type: string, enum: [add, duplicate, revive, hidden] }
              reason: { type: string }
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, reason]
            properties:
              line: { type: integer }
              reason: { type: string }
    Home:
      type: object
      additionalProperties: false
      required: [month, spend_left, per_day, last_day_extra, learning, partial, overcommitted, uncategorized, stale, data_as_of, unreviewed_count, has_data, held_deposits, plan_so_far, plan_expected]
      properties:
        month: { type: string }
        spend_left: { type: integer, format: int64, description: "cents; negative when overspent" }
        per_day: { type: integer, format: int64 }
        last_day_extra: { type: integer, format: int64 }
        learning: { type: boolean }
        partial: { type: boolean }
        overcommitted: { type: integer, format: int64 }
        uncategorized: { type: integer, format: int64, description: "the pot, waiting to be allocated" }
        stale: { type: boolean, description: "data older than 48 hours" }
        data_as_of: { type: string, format: date-time, nullable: true }
        unreviewed_count: { type: integer }
        has_data: { type: boolean }
        held_deposits: { type: integer, format: int64, description: "unreviewed deposits kept out of next month's plan" }
        plan_so_far: { type: integer, format: int64 }
        plan_expected: { type: integer, format: int64 }
    Explain:
      type: object
      additionalProperties: false
      required: [month, spend_left, spend_left_lines, sentences, groups, absorption, summary]
      properties:
        month: { type: string }
        spend_left: { type: integer, format: int64 }
        spend_left_lines:
          type: array
          description: lines that add up to spend_left
          items:
            type: object
            additionalProperties: false
            required: [label, amount]
            properties:
              label: { type: string }
              amount: { type: integer, format: int64 }
        sentences: { type: array, items: { type: string } }
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label, total, entries]
            properties:
              kind: { type: string }
              label: { type: string }
              total: { type: integer, format: int64 }
              entries:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [from, to, amount]
                  properties:
                    from: { type: string }
                    to: { type: string }
                    amount: { type: integer, format: int64 }
                    ref: { type: string }
        absorption:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [amount, from, to, causes]
            properties:
              amount: { type: integer, format: int64 }
              from: { type: integer, format: int64 }
              to: { type: integer, format: int64 }
              causes: { type: array, items: { type: string } }
        summary:
          type: object
          additionalProperties: { type: integer, format: int64 }
    RecurringSchedule:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [monthly, semi_monthly, nth_weekday, last_business_day, interval_days] }
        day: { type: integer }
        days: { type: array, items: { type: integer } }
        nth: { type: integer }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        every_months: { type: integer }
        interval_days: { type: integer }
        anchor: { type: string, format: date }
    RecurringInput:
      type: object
      additionalProperties: false
      required: [schedule]
      properties:
        kind: { type: string, enum: [bill, subscription, income, payment_plan] }
        name: { type: string }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        category_id: { type: string }
        schedule: { $ref: "#/components/schemas/RecurringSchedule" }
        installments_total: { type: integer }
    RecurringItem:
      type: object
      additionalProperties: false
      required: [id, kind, name, category_id, amount, variable, active_from, ended_on, next_date, installments_total]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [bill, subscription, income, payment_plan] }
        name: { type: string }
        category_id: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        active_from: { type: string, format: date }
        ended_on: { type: string, format: date, nullable: true }
        next_date: { type: string, format: date, nullable: true }
        installments_total: { type: integer }
    RecurringCandidate:
      type: object
      additionalProperties: false
      required: [key, name, kind, category_id, amount, variable, occurrences, last_date, next_date, after_one]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string }
        category_id: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        occurrences: { type: integer }
        last_date: { type: string }
        next_date: { type: string }
        after_one: { type: boolean }
    RecurringSignal:
      type: object
      additionalProperties: false
      required: [item_id, name, kind, on, amount]
      properties:
        item_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [bill.missing, bill.ended_check, bill.price_change] }
        on: { type: string, format: date, nullable: true }
        amount: { type: integer, format: int64 }
    Savings:
      type: object
      additionalProperties: false
      required: [fixed, basis_points, use_basis_points]
      properties:
        fixed: { type: integer, format: int64, minimum: 0 }
        basis_points: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        use_basis_points: { type: boolean }
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
    Goal:
      type: object
      additionalProperties: false
      required: [id, name, category_id, target, monthly, target_date, derived_date, balance, paused, done, borrowed, priority]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category_id: { type: string }
        target: { type: integer, format: int64 }
        monthly: { type: integer, format: int64 }
        target_date: { type: string, nullable: true }
        derived_date: { type: string, nullable: true }
        balance: { type: integer, format: int64 }
        paused: { type: boolean }
        done: { type: boolean }
        borrowed: { type: boolean }
        priority: { type: integer }
    Pot:
      type: object
      additionalProperties: false
      required: [month, uncategorized, allocated, unallocated, suggestions]
      properties:
        month: { type: string }
        uncategorized: { type: integer, format: int64 }
        allocated: { type: integer, format: int64 }
        unallocated: { type: integer, format: int64 }
        suggestions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label, amount]
            properties:
              kind: { type: string, enum: [make_permanent, restore] }
              label: { type: string }
              amount: { type: integer, format: int64 }
              split:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [dest, amount]
                  properties:
                    dest: { type: string }
                    amount: { type: integer, format: int64 }
    Figures:
      type: object
      additionalProperties: false
      required: [plan, fixed, spend_base, uncategorized, overcommitted, spend_left, per_day, ef_target]
      properties:
        plan: { type: integer, format: int64 }
        fixed: { type: integer, format: int64 }
        spend_base: { type: integer, format: int64 }
        uncategorized: { type: integer, format: int64 }
        overcommitted: { type: integer, format: int64 }
        spend_left: { type: integer, format: int64 }
        per_day: { type: integer, format: int64 }
        ef_target: { type: integer, format: int64 }
    Page:
      type: object
      description: cursor pagination envelope used by list endpoints
      required: [items]
      properties:
        items: { type: array, items: {} }
        next: { type: string, nullable: true, description: "pass as ?cursor= for the next page" }
