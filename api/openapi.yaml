openapi: 3.0.3
info:
  title: sofar
  version: 1.0.0
  description: >
    sofar's JSON API. This file is the contract (ADR-0015): handlers are checked
    against it in tests, and the web client's types are generated from it.
    Errors always use the Error schema. Writes need the Origin header to match
    the server and Content-Type application/json.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: push
  - name: ledger
  - name: categories
  - name: imports
  - name: events
  - name: budget
  - name: recurring

paths:
  /healthz:
    get:
      tags: [health]
      summary: the process is alive
      operationId: healthz
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      tags: [health]
      summary: the database is reachable and migrations are current
      operationId: readyz
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/status:
    get:
      tags: [auth]
      summary: whether setup is needed and whether the caller is signed in
      operationId: authStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/setup:
    post:
      tags: [auth]
      summary: create the one account (needs the server's setup key) and sign in
      operationId: authSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, setupKey]
              properties:
                username: { type: string }
                password: { type: string }
                setupKey: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: sign in; code is a six-digit authenticator code or a recovery code
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: end this session
      operationId: authLogout
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: start two-step enrollment; returns the secret and otpauth url
      operationId: totpSetup
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secret, url]
                properties:
                  secret: { type: string }
                  url: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/confirm:
    post:
      tags: [auth]
      summary: finish enrollment; returns recovery codes, shown once
      operationId: totpConfirm
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, recoveryCodes]
                properties:
                  ok: { type: boolean }
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/totp/disable:
    post:
      tags: [auth]
      summary: turn two-step verification off
      operationId: totpDisable
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: change the password; other sessions and push subscriptions are removed
      operationId: changePassword
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current, next]
              properties:
                current: { type: string }
                next: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/recovery-codes:
    post:
      tags: [auth]
      summary: replace the recovery codes (needs the password and two-step on)
      operationId: regenerateRecoveryCodes
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/push/config:
    get:
      tags: [push]
      summary: the VAPID public key
      operationId: pushConfig
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicKey]
                properties:
                  publicKey: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/subscribe:
    post:
      tags: [push]
      summary: register this device for notifications
      operationId: pushSubscribe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                expirationTime: { nullable: true }
                keys:
                  type: object
                  required: [auth, p256dh]
                  properties:
                    auth: { type: string }
                    p256dh: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/unsubscribe:
    post:
      tags: [push]
      summary: remove this device
      operationId: pushUnsubscribe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/devices:
    get:
      tags: [push]
      summary: how many devices receive notifications
      operationId: pushDevices
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/push/revoke-all:
    post:
      tags: [push]
      summary: stop notifications on every device
      operationId: pushRevokeAll
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/accounts:
    get:
      tags: [ledger]
      summary: every account
      operationId: listAccounts
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ledger]
      summary: create a manual account
      operationId: createAccount
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { $ref: "#/components/schemas/AccountKind" }
                currency: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{id}:
    patch:
      tags: [ledger]
      summary: change an account's kind, display name or active flag
      operationId: patchAccount
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: { $ref: "#/components/schemas/AccountKind" }
                display_name: { type: string, description: "empty clears the override" }
                active: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/transactions:
    get:
      tags: [ledger]
      summary: effective transactions, newest first
      operationId: listTransactions
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: month, in: query, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
        - { name: account, in: query, schema: { type: string, format: uuid } }
        - { name: include_hidden, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next: { type: string }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ledger]
      summary: add a manual transaction (negative amount is an outflow, in cents)
      operationId: createTransaction
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, date, amount, description]
              properties:
                account_id: { type: string, format: uuid }
                date: { type: string, format: date }
                amount: { type: integer, format: int64 }
                description: { type: string }
                payee: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}:
    get:
      tags: [ledger]
      summary: one transaction
      operationId: getTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [ledger]
      summary: >
        change overlay fields (category_id, note, tags, month, from_discretionary,
        reviewed, type) and, for manual transactions only, date, amount, description, payee
      operationId: patchTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category_id: { type: string, nullable: true }
                note: { type: string }
                tags: { type: array, items: { type: string } }
                month: { type: string, nullable: true, pattern: "^[0-9]{4}-[0-9]{2}$" }
                from_discretionary: { type: boolean }
                reviewed: { type: boolean }
                type: { type: string, nullable: true }
                date: { type: string, format: date }
                amount: { type: integer, format: int64 }
                description: { type: string }
                payee: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/split:
    post:
      tags: [ledger]
      summary: split into parts that sum to the total; an empty list removes the split
      operationId: splitTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [amount, category_id]
                    properties:
                      amount: { type: integer, format: int64 }
                      category_id: { type: string }
                      tags: { type: array, items: { type: string } }
                      note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/hide:
    post:
      tags: [ledger]
      summary: hide (a reversible soft delete that sync never re-imports)
      operationId: hideTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/unhide:
    post:
      tags: [ledger]
      summary: undo a hide
      operationId: unhideTransaction
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TransactionChange" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/categories:
    get:
      tags: [categories]
      summary: the bucket, group, category tree
      operationId: listCategories
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/CategoryGroup" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [categories]
      summary: create a custom category in a group
      operationId: createCategory
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, name]
              properties:
                group_id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/category-groups:
    post:
      tags: [categories]
      summary: create a custom group in a bucket
      operationId: createCategoryGroup
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, bucket]
              properties:
                name: { type: string }
                bucket: { type: string, enum: [income, bills, subscriptions, savings, spending] }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryGroup" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/categories/{id}:
    patch:
      tags: [categories]
      summary: rename (the id never changes)
      operationId: renameCategory
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [categories]
      summary: delete, moving transactions to reassign_to (default "other" in the same bucket)
      operationId: deleteCategory
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: reassign_to, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/categories/{id}/merge:
    post:
      tags: [categories]
      summary: move everything into another category and retire this one
      operationId: mergeCategory
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [into]
              properties:
                into: { type: string }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/imports:
    post:
      tags: [imports]
      summary: parse a file and return the dry run; nothing is written to the ledger
      operationId: createImport
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, format, content]
              properties:
                account_id: { type: string, format: uuid }
                format: { type: string, enum: [csv, ofx, qfx, qif] }
                filename: { type: string }
                content: { type: string }
                base64: { type: boolean }
                day_first: { type: boolean }
                mapping: { $ref: "#/components/schemas/CsvMapping" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}:
    get:
      tags: [imports]
      summary: a staged or applied import
      operationId: getImport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/apply:
    post:
      tags: [imports]
      summary: apply a staged import as one undoable batch
      operationId: applyImport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event_id, summary]
                properties:
                  event_id: { type: integer, format: int64 }
                  summary: { $ref: "#/components/schemas/ImportSummary" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/undo:
    post:
      tags: [imports]
      summary: hide an applied import's rows (they are never deleted)
      operationId: undoImport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/events/{id}/undo:
    post:
      tags: [events]
      summary: reverse a decision by event id
      operationId: undoEvent
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/events/{id}/redo:
    post:
      tags: [events]
      summary: reverse an undo, by the undo event's id
      operationId: redoEvent
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IntId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/home:
    get:
      tags: [budget]
      summary: the hero number for the current month, from the stored snapshot
      operationId: getHome
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/explain:
    get:
      tags: [budget]
      summary: why the number is what it is (entries, absorption ledger, plain sentences)
      operationId: explainMonth
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explain" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/plan-override:
    post:
      tags: [budget]
      summary: override the plan for a month (undo with /events/{id}/undo)
      operationId: setPlanOverride
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cents]
              properties:
                cents: { type: integer, format: int64, minimum: 0 }
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/recurring:
    get:
      tags: [recurring]
      summary: recurring items, detected candidates waiting for an answer, and signals
      operationId: listRecurring
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, candidates, signals]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RecurringItem" } }
                  candidates: { type: array, items: { $ref: "#/components/schemas/RecurringCandidate" } }
                  signals: { type: array, items: { $ref: "#/components/schemas/RecurringSignal" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [recurring]
      summary: add a recurring item by hand
      operationId: createRecurring
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/candidates/confirm:
    post:
      tags: [recurring]
      summary: say yes to a detected candidate
      operationId: confirmCandidate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string }
                kind: { type: string, enum: [bill, subscription, income, payment_plan] }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/candidates/dismiss:
    post:
      tags: [recurring]
      summary: say it is not recurring, so detection will not ask about this merchant again
      operationId: dismissCandidate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, direction]
              properties:
                key: { type: string }
                direction: { type: string, enum: ["in", "out"] }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/recurring/{id}/end:
    post:
      tags: [recurring]
      summary: stop an item (a cancelled bill frees its reserve into uncategorized)
      operationId: endRecurring
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                on: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/EventResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/transactions/{id}/recurring:
    post:
      tags: [recurring]
      summary: mark a transaction as recurring (bypasses the detection threshold)
      operationId: markRecurring
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/months/{ym}/forecast:
    get:
      tags: [budget]
      summary: the plan so far and expected by schedule, with suggestions for the pot (never applied)
      operationId: forecastMonth
      security: [{ session: [] }]
      parameters:
        - { name: ym, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [month, source_month, plan_so_far, plan_expected, extras, suggestions]
                properties:
                  month: { type: string }
                  source_month: { type: string }
                  plan_so_far: { type: integer, format: int64 }
                  plan_expected: { type: integer, format: int64 }
                  extras: { type: array, items: { type: string } }
                  suggestions:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [stream, kind, amount, suggest, label]
                      properties:
                        stream: { type: string }
                        kind: { type: string, enum: [extra_occurrence, amount_increase, lump] }
                        amount: { type: integer, format: int64 }
                        suggest: { type: string, enum: [one_time, permanent] }
                        label: { type: string }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sofar_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IntId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  responses:
    Ok:
      description: ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { type: boolean }
    EventResult:
      description: ok; event_id can be passed to /events/{id}/undo
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [event_id]
            properties:
              event_id: { type: integer, format: int64 }
    TransactionChange:
      description: the updated transaction and the events that changed it (undo them by id)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [transaction, event_ids]
            properties:
              transaction: { $ref: "#/components/schemas/Transaction" }
              event_ids: { type: array, items: { type: integer, format: int64 } }
    Error:
      description: an error; the code is stable, the message is for people
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthStatus:
      type: object
      additionalProperties: false
      required: [authenticated, setup, totpEnabled]
      properties:
        authenticated: { type: boolean }
        setup: { type: boolean, description: "true when no account exists yet" }
        totpEnabled: { type: boolean }
    RecoveryCodes:
      type: array
      minItems: 8
      maxItems: 8
      items: { type: string }
    AccountKind:
      type: string
      enum: [budget, tracked, balance_only, liability]
    Account:
      type: object
      additionalProperties: false
      required: [id, provider, name, display_name, institution, mask, currency, kind, active]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        name: { type: string }
        display_name: { type: string }
        institution: { type: string }
        mask: { type: string }
        currency: { type: string }
        kind: { $ref: "#/components/schemas/AccountKind" }
        active: { type: boolean }
    TransactionPart:
      type: object
      additionalProperties: false
      required: [amount, category_id, bucket, tags, note]
      properties:
        amount: { type: integer, format: int64 }
        category_id: { type: string }
        bucket: { type: string }
        tags: { type: array, items: { type: string } }
        note: { type: string }
    Transaction:
      type: object
      additionalProperties: false
      required: [id, account_id, date, transacted_date, amount, description, payee, memo, pending, missing_from_bank, manual, category_id, bucket, month, month_override, note, tags, hidden, from_discretionary, type, reviewed, splits]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        date: { type: string, format: date, description: "the posted date; a calendar date, never converted between zones" }
        transacted_date: { type: string, format: date, nullable: true }
        amount: { type: integer, format: int64, description: "cents; negative is an outflow" }
        description: { type: string }
        payee: { type: string }
        memo: { type: string }
        pending: { type: boolean }
        missing_from_bank: { type: boolean }
        manual: { type: boolean }
        category_id: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        month: { type: string, description: "the month the transaction counts in" }
        month_override: { type: string, nullable: true }
        note: { type: string }
        tags: { type: array, items: { type: string } }
        hidden: { type: boolean }
        from_discretionary: { type: boolean }
        type: { type: string, nullable: true }
        reviewed: { type: boolean }
        splits: { type: array, items: { $ref: "#/components/schemas/TransactionPart" } }
    Category:
      type: object
      additionalProperties: false
      required: [id, name, is_default]
      properties:
        id: { type: string }
        name: { type: string }
        is_default: { type: boolean }
    CategoryGroup:
      type: object
      additionalProperties: false
      required: [id, name, bucket, is_default, categories]
      properties:
        id: { type: string }
        name: { type: string }
        bucket: { type: string, enum: [income, bills, subscriptions, savings, spending, neutral] }
        is_default: { type: boolean }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
    CsvMapping:
      type: object
      additionalProperties: false
      required: [has_header, date, description]
      properties:
        has_header: { type: boolean }
        delimiter: { type: string }
        date: { type: string }
        date_format: { type: string }
        amount: { type: string }
        debit: { type: string }
        credit: { type: string }
        description: { type: string }
        payee: { type: string }
        memo: { type: string }
        id: { type: string }
        invert: { type: boolean }
    ImportSummary:
      type: object
      additionalProperties: false
      required: [total, add, duplicates, revive, hidden, skipped]
      properties:
        total: { type: integer }
        add: { type: integer }
        duplicates: { type: integer }
        revive: { type: integer }
        hidden: { type: integer }
        skipped: { type: integer }
        from: { type: string }
        to: { type: string }
    Import:
      type: object
      additionalProperties: false
      required: [id, status, filename, summary, rows, skipped]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [dry_run, applied, undone] }
        filename: { type: string }
        summary: { $ref: "#/components/schemas/ImportSummary" }
        rows:
          type: array
          description: the first 200 rows with what applying would do
          items:
            type: object
            additionalProperties: false
            required: [date, amount, description, outcome]
            properties:
              date: { type: string, format: date }
              amount: { type: integer, format: int64 }
              description: { type: string }
              outcome: { type: string, enum: [add, duplicate, revive, hidden] }
              reason: { type: string }
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, reason]
            properties:
              line: { type: integer }
              reason: { type: string }
    Home:
      type: object
      additionalProperties: false
      required: [month, spend_left, per_day, last_day_extra, learning, partial, overcommitted, uncategorized, stale, data_as_of, unreviewed_count, has_data, held_deposits, plan_so_far, plan_expected]
      properties:
        month: { type: string }
        spend_left: { type: integer, format: int64, description: "cents; negative when overspent" }
        per_day: { type: integer, format: int64 }
        last_day_extra: { type: integer, format: int64 }
        learning: { type: boolean }
        partial: { type: boolean }
        overcommitted: { type: integer, format: int64 }
        uncategorized: { type: integer, format: int64, description: "the pot, waiting to be allocated" }
        stale: { type: boolean, description: "data older than 48 hours" }
        data_as_of: { type: string, format: date-time, nullable: true }
        unreviewed_count: { type: integer }
        has_data: { type: boolean }
        held_deposits: { type: integer, format: int64, description: "unreviewed deposits kept out of next month's plan" }
        plan_so_far: { type: integer, format: int64 }
        plan_expected: { type: integer, format: int64 }
    Explain:
      type: object
      additionalProperties: false
      required: [month, spend_left, spend_left_lines, sentences, groups, absorption, summary]
      properties:
        month: { type: string }
        spend_left: { type: integer, format: int64 }
        spend_left_lines:
          type: array
          description: lines that add up to spend_left
          items:
            type: object
            additionalProperties: false
            required: [label, amount]
            properties:
              label: { type: string }
              amount: { type: integer, format: int64 }
        sentences: { type: array, items: { type: string } }
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label, total, entries]
            properties:
              kind: { type: string }
              label: { type: string }
              total: { type: integer, format: int64 }
              entries:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [from, to, amount]
                  properties:
                    from: { type: string }
                    to: { type: string }
                    amount: { type: integer, format: int64 }
                    ref: { type: string }
        absorption:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [amount, from, to, causes]
            properties:
              amount: { type: integer, format: int64 }
              from: { type: integer, format: int64 }
              to: { type: integer, format: int64 }
              causes: { type: array, items: { type: string } }
        summary:
          type: object
          additionalProperties: { type: integer, format: int64 }
    RecurringSchedule:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [monthly, semi_monthly, nth_weekday, last_business_day, interval_days] }
        day: { type: integer }
        days: { type: array, items: { type: integer } }
        nth: { type: integer }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        every_months: { type: integer }
        interval_days: { type: integer }
        anchor: { type: string, format: date }
    RecurringInput:
      type: object
      additionalProperties: false
      required: [schedule]
      properties:
        kind: { type: string, enum: [bill, subscription, income, payment_plan] }
        name: { type: string }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        category_id: { type: string }
        schedule: { $ref: "#/components/schemas/RecurringSchedule" }
        installments_total: { type: integer }
    RecurringItem:
      type: object
      additionalProperties: false
      required: [id, kind, name, category_id, amount, variable, active_from, ended_on, next_date, installments_total]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [bill, subscription, income, payment_plan] }
        name: { type: string }
        category_id: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        active_from: { type: string, format: date }
        ended_on: { type: string, format: date, nullable: true }
        next_date: { type: string, format: date, nullable: true }
        installments_total: { type: integer }
    RecurringCandidate:
      type: object
      additionalProperties: false
      required: [key, name, kind, category_id, amount, variable, occurrences, last_date, next_date, after_one]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string }
        category_id: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        variable: { type: boolean }
        occurrences: { type: integer }
        last_date: { type: string }
        next_date: { type: string }
        after_one: { type: boolean }
    RecurringSignal:
      type: object
      additionalProperties: false
      required: [item_id, name, kind, on, amount]
      properties:
        item_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [bill.missing, bill.ended_check, bill.price_change] }
        on: { type: string, format: date, nullable: true }
        amount: { type: integer, format: int64 }
    Page:
      type: object
      description: cursor pagination envelope used by list endpoints
      required: [items]
      properties:
        items: { type: array, items: {} }
        next: { type: string, nullable: true, description: "pass as ?cursor= for the next page" }
